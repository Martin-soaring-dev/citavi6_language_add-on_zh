name: release

on:
  # Publish a GitHub Release, or push a version tag directly.
  release:
    types: [published]
  push:
    tags:
      - "v*"
  # Allows rebuilding an already-created tag/release after fixing the workflow.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to build, e.g. v0.105-beta.1"
        required: true
        default: "v0.105-beta.1"
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}

jobs:
  build-and-attach:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 确定版本号
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "$env:RELEASE_TAG"
          if ($tag -notmatch '^v(\d+\.\d+)(-beta(?:\.\d+)?)?$') {
            throw "发布必须使用形如 v0.105 或 v0.105-beta.1 的版本标签；当前值: $tag"
          }
          $version = $Matches[1]
          $isPrerelease = $tag -match '-beta(?:\.\d+)?$'
          "TAG=$tag" >> $env:GITHUB_ENV
          "VERSION=$version" >> $env:GITHUB_ENV
          "IS_PRERELEASE=$($isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV
          Write-Host "TAG=$tag"
          Write-Host "VERSION=$version"
          Write-Host "IS_PRERELEASE=$isPrerelease"

      - name: 校验译文
        shell: pwsh
        run: ./tools/Test-Translations.ps1 -Strict

      - name: 构建语言包
        shell: pwsh
        run: ./tools/Build-LanguagePack.ps1

      - name: 打包 ZIP
        shell: pwsh
        run: ./tools/Package-Release.ps1 -Version $env:VERSION -SkipBuild

      - name: 安装 Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: 构建安装程序
        shell: pwsh
        run: ./tools/Build-Installer.ps1 -Version $env:VERSION -SkipBuild

      - name: 校验发布资产并生成 SHA-256
        shell: pwsh
        run: ./tools/Test-ReleaseAssets.ps1 -Version $env:VERSION

      - name: 创建或更新 Release 并上传资产
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = "${{ github.repository }}"
          $tag = $env:TAG
          $assets = @(
            (Join-Path $PWD "dist/citavi6-zh-v$env:VERSION.zip"),
            (Join-Path $PWD "dist/Citavi6-zh-Setup-v$env:VERSION.exe"),
            (Join-Path $PWD "dist/SHA256SUMS-v$env:VERSION.txt")
          )
          foreach ($path in $assets) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or (Get-Item -LiteralPath $path).Length -le 0) {
              throw "发布资产缺失或为空: $path"
            }
          }

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            'User-Agent' = 'github-actions'
            Accept = 'application/vnd.github+json'
          }

          $release = $null
          try {
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/tags/$tag" -Headers $headers
          } catch {
            $release = $null
          }

          if (-not $release) {
            $notes = @(
              "Citavi 6 简体中文语言包 $tag（自动构建）。",
              "",
              "推荐使用 Citavi6-zh-Setup 安装程序；也提供 ZIP 脚本安装包。",
              "安装前请备份现有语言包。未翻译条目会显示英文原文，详情见仓库 README。"
            ) -join "`n"
            if ($env:IS_PRERELEASE -eq 'true') {
              $notes = "【Beta 测试版】此版本用于预发布验证，安装前请备份现有语言包。`n`n" + $notes
            }
            $body = @{
              tag_name = $tag
              name = "Citavi 6 中文语言包 $tag"
              body = $notes
              draft = $false
              prerelease = ($env:IS_PRERELEASE -eq 'true')
            } | ConvertTo-Json
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases" -Method Post -Headers $headers -ContentType 'application/json; charset=utf-8' -Body $body
          }

          $existing = @()
          try {
            $existing = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/$($release.id)/assets" -Headers $headers
          } catch {
            $existing = @()
          }
          foreach ($path in $assets) {
            $name = [IO.Path]::GetFileName($path)
            foreach ($asset in $existing) {
              if ($asset.name -eq $name) {
                Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/assets/$($asset.id)" -Method Delete -Headers $headers | Out-Null
              }
            }
          }

          foreach ($path in $assets) {
            $name = [IO.Path]::GetFileName($path)
            $uri = "https://uploads.github.com/repos/$repo/releases/$($release.id)/assets?name=$([uri]::EscapeDataString($name))"
            $uploaded = Invoke-RestMethod -Uri $uri -Method Post -Headers $headers -ContentType 'application/octet-stream' -InFile $path
            Write-Host ("上传: {0} ({1:N2} MB)" -f $uploaded.name, ($uploaded.size / 1MB))
          }

      - name: 上传 ZIP 构件
        uses: actions/upload-artifact@v4
        with:
          name: citavi6-zh-language-pack
          path: dist/citavi6-zh-*.zip
          if-no-files-found: error

name: release

on:
  # 在 GitHub 上发布 Release(含由 Draft 转为 Published)时触发
  release:
    types: [published]
  # 也支持直接推送 v* 标签
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# 发布 Release 时,若同时触发了 tag push,只保留最新一次运行,避免重复构建
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-attach:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验译文
        shell: pwsh
        run: ./tools/Test-Translations.ps1

      - name: 构建语言包
        shell: pwsh
        run: ./tools/Build-LanguagePack.ps1

      - name: 打包 zip
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v','' } else { 'dev' }
          ./tools/Package-Release.ps1 -Version $v -SkipBuild

      - name: 把 zip 附到 Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'release') { "${{ github.event.release.tag_name }}" } else { "${{ github.ref_name }}" }
          $zip = (Get-ChildItem dist/citavi6-zh-*.zip | Select-Object -First 1).FullName
          Write-Host "Release: $tag  <-  $zip"

          # 若 Release 已存在(用户在 GitHub 上发布的),只上传资产;否则创建一个
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
          } else {
            $notes = @"
          Citavi 6 简体中文语言包(自动构建)。

          安装:把 zip 中的 ``zh`` 文件夹复制到 Citavi 安装目录的 ``bin\`` 下,例如
          ``C:\Program Files (x86)\Citavi 6\bin\zh\``,然后打开 Citavi → 工具 → 语言 → 选择「中文」。

          卸载:删除该 ``zh`` 文件夹,并在语言菜单切回其他语言。
          未翻译的条目会显示英文原文。详见仓库 README。
          "@
            gh release create $tag $zip --title "Citavi 6 中文语言包 $tag" --notes $notes
          }

      - name: 上传 zip 构件
        uses: actions/upload-artifact@v4
        with:
          name: citavi6-zh-language-pack
          path: dist/citavi6-zh-*.zip
          if-no-files-found: error
